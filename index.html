<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentDB Chat</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 600px; margin: 20px auto; background: #f4f4f9; padding: 10px; }
        #chat-box { background: white; border: 1px solid #ddd; height: 450px; overflow-y: scroll; padding: 15px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .message { margin-bottom: 12px; line-height: 1.4; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .user { font-weight: bold; color: #3498db; }
        .msg-text { color: #333; margin-left: 5px; }
        #controls { display: flex; gap: 10px; }
        input { flex-grow: 1; padding: 12px; border: 1px solid #ddd; border-radius: 5px; outline: none; }
        button { padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2980b9; }
        button:disabled { background: #ccc; }
        .status { font-size: 0.8rem; color: #888; text-align: right; margin-bottom: 5px; }
    </style>
</head>
<body>
    <h2>Classroom Chat</h2>
    <div class="status" id="status">Updating...</div>
    <div id="chat-box"></div>
    
    <form id="chat-form">
        <div id="controls">
            <input type="text" id="msg-input" placeholder="Type your message..." required maxlength="500">
            <button type="submit" id="send-btn">Send</button>
        </div>
    </form>

    <script src="script.js"></script>
</body>
</html>
